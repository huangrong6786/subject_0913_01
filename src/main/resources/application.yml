server:
  port: 8080

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 观测数据 CSV 批量导入：50,000 行约 5MB，放宽到 50MB
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

shiro:
  # 鉴权由 Shiro 过滤器链（authcBasic）完成，不启用 @RequiresPermissions 注解 AOP，
  # 避免 Shiro 的 JDK 动态代理创建器与 Spring 事务的 CGLIB 代理创建器互相二次包装。
  annotations:
    enabled: false

evops:
  task:
    # 投饵记录批量落账定时任务：定时与手工触发共用同一执行路径，
    # 由 t_task_lock（租约锁）+ t_task_run（周期幂等台账）+ 落账 CAS 共同防重复处理。
    feeding-post:
      enabled: true
      # 默认每天 02:00 执行当天业务周期（Spring 6 段 cron：秒 分 时 日 月 周）
      cron: "0 0 2 * * *"
      # 持锁/执行租约（秒）：异常退出后超过此时长可被下一次触发接管，不会永久阻塞
      lease-seconds: 300
  import:
    # 观测数据 CSV 批量导入：按分片处理（数据行数/片），50,000 行默认切 50 片
    shard-size: 1000
    # 原始上传文件落盘目录：失败分片重试/断网续传的数据来源
    storage-dir: ./data/imports
    # 分片/批次僵死判定（秒）：RUNNING 超过此时长视为异常退出，可被接管重试
    stale-seconds: 300
    # 导入结果响应中携带的失败明细上限（完整明细走行明细接口）
    max-failures-in-response: 100

logging:
  level:
    com.evops: INFO
