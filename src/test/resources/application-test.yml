spring:
  datasource:
    url: jdbc:h2:mem:evops-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 回归测试直接调用任务方法模拟定时/手工并发，关闭真实调度避免干扰
evops:
  task:
    feeding-post:
      enabled: false
      lease-seconds: 300
  import:
    # 小分片：让集成测试在小文件下也能覆盖多分片路径；规模测试自行覆盖大分片
    shard-size: 5
    storage-dir: ${java.io.tmpdir}/evops-test-imports
    stale-seconds: 300
    max-failures-in-response: 100
